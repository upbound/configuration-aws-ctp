# Single comprehensive E2E test for configuration-aws-ctp.
#
# Spins up a real EKS cluster via the composition and exercises the full stack in
# one run: UXP + IRSA-based S3 backup + the k8gb producer (operator + CoreDNS via a
# UDP+TCP NLB) + ArgoCD (UI Gateway/HTTPRoute + app-of-apps), which also pulls in
# cert-manager (always-on), the Envoy Gateway data plane, and the AWS Load Balancer
# Controller (EKS Pod Identity).
#
# WHY ONE TEST: consolidated from the former e2etest-controlplane (backup only) and
# e2etest-addons (k8gb + argocd) so a single ephemeral cluster covers the whole
# stack - one e2e run instead of two, cutting wall-clock and cost. Mirrors
# configuration-azure-ctp's single `controlplane` e2e.
#
# Credentials: the AWS ProviderConfig "default", namespaced in the same
# namespace as the ControlPlane under test (the e2e uses "platform"), uses
# Upbound-injected identity (source: Upbound) federated to the solutions e2e AWS
# role (arn:aws:iam::609897127049:role/solutions-e2e-provider-aws), so no
# pre-provisioned Secret is required on the ephemeral test control plane.
# NOTE ON NAMING: the OIDC subject `up test` presents embeds this test's name
# (mcp:<org>/configuration-aws-ctp-uptest-<name>:provider:provider-aws); the role
# trust must allow it. This test is named `controlplane` to match the canonical
# cross-cloud convention (as in configuration-azure-ctp). If e2e auth fails after
# this consolidation, register the `...-uptest-controlplane` subject on the role
# (or confirm its trust uses a wildcard).
#
# What this asserts: the ControlPlane XR reaches Ready=True. Because
# function-auto-ready aggregates every composed resource, Ready=True implies UXP,
# the backup chain + IRSA, and every add-on Release/Object came up cleanly. The
# k8gb CoreDNS endpoint is surfaced on status.controlplane.k8gb.coreDNSEndpoint
# (verify it is non-empty manually - E2ETest cannot assert arbitrary status fields).
#
# No license is supplied - the backup wiring and the add-ons need none. Executing a
# real backup run would need a UXP Standard-plan (or above) license; this test only
# asserts the backup chain is wired and Ready, so it needs none.
#
# Scope: installation only. It does NOT test DNS failover - nothing writes the NS
# delegation yet (FleetGslb is a separate workstream), so GSLB is not functional
# end-to-end after this test.
#
# Requires AWS quota for one three-node t3.medium EKS cluster plus the NLB/ELB the
# add-ons provision. Expected runtime: 40-70 minutes.
apiVersion: meta.dev.upbound.io/v1alpha1
kind: E2ETest
metadata:
  name: controlplane
spec:
  crossplane:
    autoUpgrade:
      channel: Stable
  defaultConditions:
  - Ready
  timeoutSeconds: 5400
  cleanupTimeoutSeconds: 1800
  extraResources:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: platform
  - apiVersion: aws.m.upbound.io/v1beta1
    kind: ProviderConfig
    metadata:
      name: default
      namespace: platform
    spec:
      credentials:
        source: Upbound
        upbound:
          webIdentity:
            roleARN: arn:aws:iam::609897127049:role/solutions-e2e-provider-aws
  manifests:
  - apiVersion: aws.platform.upbound.io/v1alpha1
    kind: ControlPlane
    metadata:
      name: e2e-test-cp
      namespace: platform
    spec:
      parameters:
        id: e2e-test-cp
        region: us-east-1
        version: "1.34"
        nodes:
          count: 3
          instanceType: t3.medium
        backup:
          enabled: "yes"
          location: arn:aws:s3:::upbound-e2e-test-cp-backup
        k8gb:
          enabled: "yes"
          dnsZone: gslb.example.com
          parentZone: example.com
          strategy: failover
        argocd:
          enabled: "yes"
          hostname: argocd.example.com
          url: https://github.com/argoproj/argocd-example-apps
  skipDelete: false
