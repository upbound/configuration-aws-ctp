# E2E test: ControlPlane with the k8gb + ArgoCD add-ons enabled.
# Spins up a real EKS cluster via the configuration-aws-ctp composition, installs
# UXP, and then the full add-on stack: cert-manager (always-on), nginx-ingress,
# the AWS Load Balancer Controller (EKS Pod Identity), k8gb (operator + CoreDNS
# exposed via an NLB), and ArgoCD (UI Ingress + root app-of-apps).
#
# Credentials: the AWS ProviderConfig "default" uses Upbound-injected identity
# federated to the solutions e2e AWS role, so no pre-provisioned Secret is
# required on the ephemeral test control plane.
#
# What this asserts: the ControlPlane XR reaches Ready=True. Because
# function-auto-ready aggregates every composed resource, Ready=True implies all
# add-on Releases reached state=deployed and every add-on Object was applied —
# i.e. the whole add-on stack installs cleanly. The AWS LB Controller must be up
# for k8gb's CoreDNS NLB to be created (Step 3 rationale).
#
# Scope: this is an *installation* e2e. It does NOT test DNS failover — nothing
# writes the NS delegation yet (FleetGslb is a separate workstream), so GSLB is
# not functional end-to-end. The real UDP NLB endpoint is surfaced on
# status.controlplane.k8gb.coreDNSEndpoint; verify it is non-empty manually
# (E2ETest cannot assert arbitrary status fields). No license is supplied — the
# add-ons here need none.
#
# Requires sufficient AWS quotas for one t3.medium three-node EKS cluster plus the
# NLB/ELB the add-ons provision. Expected runtime: 40-70 minutes.
apiVersion: meta.dev.upbound.io/v1alpha1
kind: E2ETest
metadata:
  name: controlplane-with-addons
spec:
  crossplane:
    autoUpgrade:
      channel: Stable
  defaultConditions:
  - Ready
  timeoutSeconds: 5400
  cleanupTimeoutSeconds: 1800
  extraResources:
  - apiVersion: aws.m.upbound.io/v1beta1
    kind: ProviderConfig
    metadata:
      name: default
      namespace: default
    spec:
      credentials:
        source: Upbound
        upbound:
          webIdentity:
            roleARN: arn:aws:iam::609897127049:role/solutions-e2e-provider-aws
  manifests:
  - apiVersion: aws.platform.upbound.io/v1alpha1
    kind: ControlPlane
    metadata:
      name: e2e-addons-cp
    spec:
      parameters:
        id: e2e-addons-cp
        region: us-east-1
        version: "1.34"
        nodes:
          count: 3
          instanceType: t3.medium
        k8gb:
          enabled: "yes"
          dnsZone: gslb.example.com
          parentZone: example.com
          strategy: failover
        argocd:
          enabled: "yes"
          hostname: argocd.example.com
          url: https://github.com/argoproj/argocd-example-apps
  skipDelete: false
