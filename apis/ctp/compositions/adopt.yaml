# Adopt variant of the ControlPlane Composition, for the dynamic-provisioning
# pipeline. Identical to controlplane.aws.platform.upbound.io except for the three
# function-aws-query discovery steps ahead of the ctp step.
#
# Why a separate Composition and not a flag on the default one: function-aws-query
# reads its credentials from the pipeline step's `credentials` block, which is
# static in the Composition, and it fails the whole composition when that block is
# missing. Consumers who have no aws-creds Secret must keep working, so the query
# steps live here and control planes opt in with
# spec.crossplane.compositionRef.name: controlplane-adopt.aws.platform.upbound.io.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  labels:
    provider: aws
    variant: adopt
  name: controlplane-adopt.aws.platform.upbound.io
spec:
  compositeTypeRef:
    apiVersion: aws.platform.upbound.io/v1alpha1
    kind: ControlPlane
  mode: Pipeline
  pipeline:
  - functionRef:
      name: crossplane-contrib-function-extra-resources
    step: fetch-control-planes
    input:
      apiVersion: extra-resources.fn.crossplane.io/v1beta1
      kind: Input
      spec:
        extraResources:
        - apiVersion: aws.platform.upbound.io/v1alpha1
          kind: ControlPlane
          into: allControlPlanes
          type: Selector
          selector:
            maxMatch: 100
            minMatch: 0

  # Everything taggable, in one server-side tag-filtered call. Returns
  # [{arn, tags}]; the AWS identifier is the last segment of the ARN. Covers VPC,
  # subnets, internet gateway, route table, security group and the k8gb EIPs.
  - functionRef:
      name: upbound-function-aws-query
    step: discover-tagged
    input:
      apiVersion: aws.fn.crossplane.io/v1beta1
      kind: Input
      queryType: GetResources
      regionRef: spec.parameters.region
      filtersRef: spec.parameters.adopt.tagFilters
      parameters:
        resourceTypeFilters: "ec2:vpc,ec2:subnet,ec2:internet-gateway,ec2:route-table,ec2:security-group,ec2:elastic-ip,eks:podidentityassociation"
      target: context.adopt.tagged
    credentials:
    - name: aws-creds
      source: Secret
      secretRef:
        namespace: default
        name: aws-creds

  # Subnet-to-route-table associations are not taggable and have no ARN, so they
  # come from Cloud Control. hydrate stays on: the ctp step matches on the
  # SubnetId/RouteTableId properties.
  - functionRef:
      name: upbound-function-aws-query
    step: discover-assoc
    input:
      apiVersion: aws.fn.crossplane.io/v1beta1
      kind: Input
      queryType: ListResources
      regionRef: spec.parameters.region
      parameters:
        typeName: "AWS::EC2::SubnetRouteTableAssociation"
      target: context.adopt.assoc
    credentials:
    - name: aws-creds
      source: Secret
      secretRef:
        namespace: default
        name: aws-creds

  # discover-pia REMOVED. Settled empirically on 2026-09-04: the Resource Groups
  # Tagging API does index eks:podidentityassociation (a live query returned 25
  # entries), so Pod Identity associations arrive in the discover-tagged sweep
  # above and need no Cloud Control call. eks:podidentityassociation is included
  # in its resourceTypeFilters.
  #
  # The Cloud Control route was also actively harmful here. AWS::EKS::PodIdentity
  # Association requires a resourceModel carrying ClusterName, which a static
  # Composition cannot template, and function-aws-query returns a FATAL result on
  # a rejected query - so the placeholder aborted the entire composition and no
  # resource was created at all:
  #   InvalidRequestException: AWS::EKS::PodIdentityAssociation Handler returned
  #   status FAILED: The parameter name contains invalid characters
  # Do not reintroduce a query whose input cannot be templated.

  - functionRef:
      name: upbound-configuration-aws-ctpctp
    step: ctp

  - functionRef:
      name: crossplane-contrib-function-auto-ready
    step: auto-ready
