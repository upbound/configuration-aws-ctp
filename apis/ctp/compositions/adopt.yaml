# Adopt variant of the ControlPlane Composition, for the dynamic-provisioning
# pipeline. Identical to controlplane.aws.platform.upbound.io except for the three
# function-aws-query discovery steps ahead of the ctp step.
#
# Why a separate Composition and not a flag on the default one: function-aws-query
# reads its credentials from the pipeline step's `credentials` block, which is
# static in the Composition, and it fails the whole composition when that block is
# missing. Consumers who have no aws-creds Secret must keep working, so the query
# steps live here and control planes opt in with
# spec.crossplane.compositionRef.name: controlplane-adopt.aws.platform.upbound.io.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  labels:
    provider: aws
    variant: adopt
  name: controlplane-adopt.aws.platform.upbound.io
spec:
  compositeTypeRef:
    apiVersion: aws.platform.upbound.io/v1alpha1
    kind: ControlPlane
  mode: Pipeline
  pipeline:
  - functionRef:
      name: crossplane-contrib-function-extra-resources
    step: fetch-control-planes
    input:
      apiVersion: extra-resources.fn.crossplane.io/v1beta1
      kind: Input
      spec:
        extraResources:
        - apiVersion: aws.platform.upbound.io/v1alpha1
          kind: ControlPlane
          into: allControlPlanes
          type: Selector
          selector:
            maxMatch: 100
            minMatch: 0

  # Everything taggable, in one server-side tag-filtered call. Returns
  # [{arn, tags}]; the AWS identifier is the last segment of the ARN. Covers VPC,
  # subnets, internet gateway, route table, security group and the k8gb EIPs.
  - functionRef:
      name: upbound-function-aws-query
    step: discover-tagged
    input:
      apiVersion: aws.fn.crossplane.io/v1beta1
      kind: Input
      queryType: GetResources
      regionRef: spec.parameters.region
      filtersRef: spec.parameters.adopt.tagFilters
      parameters:
        resourceTypeFilters: "ec2:vpc,ec2:subnet,ec2:internet-gateway,ec2:route-table,ec2:security-group,ec2:elastic-ip"
      target: context.adopt.tagged
    credentials:
    - name: aws-creds
      source: Secret
      secretRef:
        namespace: default
        name: aws-creds

  # Subnet-to-route-table associations are not taggable and have no ARN, so they
  # come from Cloud Control. hydrate stays on: the ctp step matches on the
  # SubnetId/RouteTableId properties.
  - functionRef:
      name: upbound-function-aws-query
    step: discover-assoc
    input:
      apiVersion: aws.fn.crossplane.io/v1beta1
      kind: Input
      queryType: ListResources
      regionRef: spec.parameters.region
      parameters:
        typeName: "AWS::EC2::SubnetRouteTableAssociation"
      target: context.adopt.assoc
    credentials:
    - name: aws-creds
      source: Secret
      secretRef:
        namespace: default
        name: aws-creds

  # CONDITIONAL - decide with the one command below before adding this step.
  #
  # Pod Identity associations are IdentifierFromProvider (the association_id,
  # format "a-" + 17 lowercase alphanumerics). Two possible sources:
  #
  #   Route 1, preferred: the discover-tagged sweep above. The type IS taggable
  #   (verified: PodIdentityAssociationSpecForProvider declares tags, and
  #   configuration-aws-eks stamps the identity tags on it), so IF the Resource
  #   Groups Tagging API indexes it, just add eks:podidentityassociation to that
  #   step's resourceTypeFilters and delete this step. One call, no ordering
  #   problem. Being taggable does NOT guarantee the Tagging API indexes it -
  #   that is the thing to check.
  #
  #   Route 2, this step: Cloud Control. Verified 2026-09-01 to require a
  #   resourceModel carrying ClusterName; a bare call is rejected with
  #     InvalidRequestException: Missing or invalid ResourceModel property in
  #     AWS::EKS::PodIdentityAssociation list handler request input.
  #     Required property: (#: required key [ClusterName] not found)
  #   With naming: Deterministic the cluster is {id}-eks, so ClusterName is
  #   computable from the XR alone - no status field and no second reconcile.
  #
  # Decide with:
  #   aws resourcegroupstaggingapi get-resources --region <region> \
  #     --resource-type-filters eks:podidentityassociation
  # An empty ResourceTagMappingList means Route 1 works: drop this step. An error
  # naming valid resource types means Route 1 does not: keep this step.
  #
  # Keeping both is also acceptable - build_external_names takes the PIA from
  # whichever source supplies it (Task 8), so a redundant step costs one AWS call
  # and nothing else. If unadopted the failure is loud, not silent: AWS rejects a
  # duplicate association for the same cluster/namespace/serviceAccount.
  - functionRef:
      name: upbound-function-aws-query
    step: discover-pia
    input:
      apiVersion: aws.fn.crossplane.io/v1beta1
      kind: Input
      queryType: ListResources
      regionRef: spec.parameters.region
      parameters:
        typeName: "AWS::EKS::PodIdentityAssociation"
        # Deterministic naming makes this computable; see Task 12 upstream.
        resourceModel: '{"ClusterName": "<id>-eks"}'
      target: context.adopt.pia
    credentials:
    - name: aws-creds
      source: Secret
      secretRef:
        namespace: default
        name: aws-creds

  - functionRef:
      name: upbound-configuration-aws-ctpctp
    step: ctp

  - functionRef:
      name: crossplane-contrib-function-auto-ready
    step: auto-ready
