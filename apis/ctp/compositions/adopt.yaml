# Adopt variant of the ControlPlane Composition, for the dynamic-provisioning
# pipeline. Identical to controlplane.aws.platform.upbound.io except for the three
# function-aws-query discovery steps ahead of the ctp step.
#
# Why a separate Composition and not a flag on the default one: function-aws-query
# reads its credentials from the pipeline step's `credentials` block, which is
# static in the Composition, and it fails the whole composition when that block is
# missing. Consumers who have no aws-creds Secret must keep working, so the query
# steps live here and control planes opt in with
# spec.crossplane.compositionRef.name: controlplane-adopt.aws.platform.upbound.io.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  labels:
    provider: aws
    variant: adopt
  name: controlplane-adopt.aws.platform.upbound.io
spec:
  compositeTypeRef:
    apiVersion: aws.platform.upbound.io/v1alpha1
    kind: ControlPlane
  mode: Pipeline
  pipeline:
  - functionRef:
      name: crossplane-contrib-function-extra-resources
    step: fetch-control-planes
    input:
      apiVersion: extra-resources.fn.crossplane.io/v1beta1
      kind: Input
      spec:
        extraResources:
        - apiVersion: aws.platform.upbound.io/v1alpha1
          kind: ControlPlane
          into: allControlPlanes
          type: Selector
          selector:
            maxMatch: 100
            minMatch: 0

  # Everything taggable, in one server-side tag-filtered call. Returns
  # [{arn, tags}]; the AWS identifier is the last segment of the ARN. Covers VPC,
  # subnets, internet gateway, route table, security group and the k8gb EIPs.
  - functionRef:
      name: upbound-function-aws-query
    step: discover-tagged
    input:
      apiVersion: aws.fn.crossplane.io/v1beta1
      kind: Input
      queryType: GetResources
      regionRef: spec.parameters.region
      filtersRef: spec.parameters.adopt.tagFilters
      parameters:
        resourceTypeFilters: "ec2:vpc,ec2:subnet,ec2:internet-gateway,ec2:route-table,ec2:security-group,ec2:elastic-ip,eks:podidentityassociation"
      target: context.adopt.tagged
    credentials:
    - name: aws-creds
      source: Secret
      secretRef:
        namespace: default
        name: aws-creds

  # Authoritative, live-only reads for the two things the tag sweep above cannot
  # resolve. Unlike the Tagging API an EC2 describe never returns a deleted
  # resource, and DescribeRouteTables carries each route table's associations,
  # which no tag-based or Cloud Control query exposes at all.
  #
  # Both are scoped by spec.parameters.adopt.ec2Filters, which takes native EC2
  # filter names - a tag filter is "tag:upbound.io/ctp-id", not the bare tag key
  # tagFilters uses above. With no filter the calls go region-wide; that is
  # merely wasteful rather than wrong, because build_external_names re-checks
  # the identity tag on every entry.
  - functionRef:
      name: upbound-function-aws-query
    step: discover-subnets
    input:
      apiVersion: aws.fn.crossplane.io/v1beta1
      kind: Input
      queryType: DescribeEc2
      regionRef: spec.parameters.region
      filtersRef: spec.parameters.adopt.ec2Filters
      parameters:
        operation: Subnets
      target: context.adopt.subnets
    credentials:
    - name: aws-creds
      source: Secret
      secretRef:
        namespace: default
        name: aws-creds

  # Route tables come along for the ride: the target of this step is the
  # associations, matched to their subnets by build_external_names. It runs
  # after discover-subnets only for readability - there is no data dependency,
  # both read the same filter off the XR spec.
  - functionRef:
      name: upbound-function-aws-query
    step: discover-route-tables
    input:
      apiVersion: aws.fn.crossplane.io/v1beta1
      kind: Input
      queryType: DescribeEc2
      regionRef: spec.parameters.region
      filtersRef: spec.parameters.adopt.ec2Filters
      parameters:
        operation: RouteTables
      target: context.adopt.routeTables
    credentials:
    - name: aws-creds
      source: Secret
      secretRef:
        namespace: default
        name: aws-creds

  # The two database SecurityGroupRules are NOT discovered here. Their
  # external-name is Terraform's sgrule-<crc32> hash, not an AWS identifier, so
  # DescribeSecurityGroupRules cannot supply it - adopt.py derives it instead
  # (see sgrule_external_name). It could still supply the live rule signature
  # the hash is computed from, replacing the constants mirrored from
  # configuration-aws-network, but DescribeSecurityGroupRules can only be scoped
  # by group-id: aws_security_group_rule carries no tags, so tag:upbound.io/ctp-id
  # matches nothing. The group id is discovered by the sweep above and is
  # therefore not available as a static filter in this Composition. Until that
  # is solved the hash stands, and its inputs stay mirrored by hand.

  # discover-assoc REMOVED. AWS::EC2::SubnetRouteTableAssociation cannot be
  # listed safely in a shared account. ListResources enumerates EVERY
  # association in the account and hydration calls GetResource on each one, so a
  # single foreign or main-route-table association aborts the whole composition -
  # function-aws-query returns a FATAL result on any error:
  #   InvalidRequestException: AWS::EC2::SubnetRouteTableAssociation Handler
  #   returned status FAILED: The RouteTableAssociation does not belong to a subnet
  # hydrate=false would avoid the GetResource calls but returns identifiers only,
  # with no SubnetId/RouteTableId to map an association to its logical name, so it
  # buys nothing.
  #
  # Closed by discover-route-tables above: ec2:DescribeRouteTables returns each
  # route table with its associations inline, so there is nothing to enumerate
  # account-wide and nothing to hydrate. Kept as a record of why Cloud Control
  # is not the answer here - the lesson generalises to any hydrated
  # ListResources call in a shared account.

  - functionRef:
      name: upbound-configuration-aws-ctpctp
    step: ctp

  - functionRef:
      name: crossplane-contrib-function-auto-ready
    step: auto-ready
