apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: controlplanes.aws.platform.upbound.io
spec:
  group: aws.platform.upbound.io
  names:
    categories:
    - crossplane
    kind: ControlPlane
    plural: controlplanes
  scope: Namespaced
  # REQUIRED with two Compositions. An XR pinning neither compositionRef nor
  # compositionSelector otherwise gets one at RANDOM - Crossplane's selector
  # chain ends in a rand.Intn over every candidate matching the type - and the
  # choice is persisted, so it is permanent. Landing on the import variant
  # without an aws-creds Secret in `default` means the XR never reconciles.
  # Opt into import with compositionRef by name, or matchLabels {variant: import}.
  defaultCompositionRef:
    name: controlplane.aws.platform.upbound.io
  versions:
  - name: v1alpha1
    referenceable: true
    schema:
      openAPIV3Schema:
        description: ControlPlane is the Schema for creating AWS EKS clusters configured as Upbound control planes with optional UXP backup.
        properties:
          spec:
            description: ControlPlaneSpec defines the desired state of ControlPlane.
            properties:
              parameters:
                type: object
                description: ControlPlane configuration parameters.
                properties:
                  id:
                    type: string
                    minLength: 1
                    description: >-
                      ID of this ControlPlane that other objects will use to
                      refer to it. Also the import identity: it is stamped as the
                      upbound.io/ctp-id tag on every AWS resource this
                      configuration owns, and the import path re-checks that tag
                      before injecting any identifier. Non-empty because an
                      empty key would match nothing and disable that check.
                  region:
                    type: string
                    description: Region is the region you'd like your resource to be created in.
                  providerConfigName:
                    description: Crossplane ProviderConfig to use for provisioning this resources
                    type: string
                    default: default
                  version:
                    description: Kubernetes version for the EKS cluster
                    type: string
                    enum:
                    - "1.35"
                    - "1.34"
                    - "1.33"
                    - "1.32"
                    - "1.31"
                    default: "1.34"
                  nodes:
                    type: object
                    description: EKS node configuration parameters.
                    properties:
                      count:
                        type: integer
                        description: Desired node count, from 1 to 100.
                      instanceType:
                        type: string
                        description: instance types associated with the Node Group.
                        default: t3.small
                    required:
                    - count
                    - instanceType
                  network:
                    type: object
                    description: >-
                      VPC network topology for the control plane. Optional - defaults to a
                      resilient three-AZ layout (public + private subnets across
                      <region>a/<region>b/<region>c). Values are passed through to the
                      underlying configuration-aws-network Network.
                    properties:
                      vpcCidrBlock:
                        type: string
                        description: CIDR block for the VPC.
                        default: 192.168.0.0/16
                      subnets:
                        type: array
                        description: >-
                          Subnets to create in the VPC. When omitted, a three-AZ layout of
                          public and private /19 subnets is derived from the region. When
                          provided, ensure the subnet CIDRs fit within vpcCidrBlock.
                        items:
                          type: object
                          properties:
                            availabilityZone:
                              type: string
                            type:
                              type: string
                              enum:
                              - public
                              - private
                            cidrBlock:
                              type: string
                          required:
                          - availabilityZone
                          - type
                          - cidrBlock
                  accessConfig:
                    type: object
                    description: EKS access configuration.
                    properties:
                      bootstrapClusterCreatorAdminPermissions:
                        type: boolean
                        description: Whether or not to bootstrap the access config values to the cluster.
                      authenticationMode:
                        type: string
                        enum:
                        - CONFIG_MAP
                        - API
                        - API_AND_CONFIG_MAP
                    default:
                      bootstrapClusterCreatorAdminPermissions: true
                      authenticationMode: API_AND_CONFIG_MAP
                  iam:
                    type: object
                    description: IAM configuration to connect as ClusterAdmin.
                    properties:
                      principalArn:
                        description: The principal ARN to connect as ClusterAdmin.
                        type: string
                  uxp:
                    type: object
                    description: UXP installation configuration.
                    properties:
                      version:
                        type: string
                        description: UXP Helm chart version to install (e.g. 2.2.1-up.1).
                        default: "2.2.1-up.1"
                    default:
                      version: "2.2.1-up.1"
                  backup:
                    type: object
                    description: UXP backup configuration using InjectedIdentity (IRSA).
                    properties:
                      enabled:
                        type: string
                        description: Enable UXP backup for this control plane ("yes" or "no").
                        default: "no"
                        enum: ["yes", "no"]
                      location:
                        type: string
                        description: S3 bucket ARN for backup storage. Required when backup is enabled. The bucket is created if it does not already exist and is never deleted by Crossplane.
                        pattern: '^arn:aws:s3:::[a-z0-9][a-z0-9.-]*[a-z0-9]$'
                      bucketRegion:
                        type: string
                        description: >-
                          AWS region for the backup S3 bucket. Defaults to the control plane's
                          region. Set this to a different region than the cluster for cross-region
                          disaster recovery, so backups survive a full outage of the cluster's region.
                      schedule:
                        type: string
                        description: >-
                          Backup schedule. Accepts named shortcuts (@hourly, @daily, @weekly),
                          standard 5-field cron expressions (e.g. "0 0/4 * * *", "0/15 * * * 1-5"),
                          or duration intervals (e.g. "@every 1h30m10s"). When set, a BackupSchedule
                          resource is created on the control plane's EKS cluster.
                      installFrom:
                        type: object
                        description: >-
                          Restore UXP state from an existing backup during initial provisioning.
                          Applied once at bootstrap - ignored on subsequent reconciles.
                          Use this when changing node instance types: provision a new ControlPlane
                          with the desired instanceType and set installFrom to restore state from
                          the existing control plane's backup.
                        properties:
                          location:
                            type: string
                            description: S3 bucket ARN containing the source backup.
                            pattern: '^arn:aws:s3:::[a-z0-9][a-z0-9.-]*[a-z0-9]$'
                          name:
                            type: string
                            description: Name of the backup to restore from (e.g. "my-backup-002").
                        required:
                        - location
                        - name
                  license:
                    type: object
                    description: UXP enterprise license configuration. When set, provisions a license on the control plane's UXP instance.
                    properties:
                      secretRef:
                        type: object
                        description: Reference to a Secret on the management cluster containing the UXP license JSON under the key "license".
                        properties:
                          name:
                            type: string
                            description: Name of the secret containing the UXP license JSON.
                          namespace:
                            type: string
                            description: Namespace of the secret.
                            default: default
                        required:
                        - name
                    required:
                    - secretRef
                  providerVerticalPodAutoscaling:
                    type: object
                    description: >-
                      Enable Vertical Pod Autoscaling for UXP providers. Requires Metrics Server
                      and VPA v1.4+ pre-installed on the EKS cluster. Needs a Standard or higher license.
                    properties:
                      enabled:
                        type: string
                        description: Enable provider VPA ("yes" or "no").
                        default: "no"
                        enum: ["yes", "no"]
                      minCpu:
                        type: string
                        description: Minimum CPU allowed for provider containers (e.g. "100m").
                      maxCpu:
                        type: string
                        description: Maximum CPU allowed for provider containers (e.g. "2").
                      minMemory:
                        type: string
                        description: Minimum memory allowed for provider containers (e.g. "100Mi").
                      maxMemory:
                        type: string
                        description: Maximum memory allowed for provider containers (e.g. "4000Mi").
                  knative:
                    type: object
                    description: >-
                      Enable Knative scale-to-zero for UXP functions. When enabled, Knative Serving is
                      installed automatically on the EKS cluster (cert-manager, its dependency, is always
                      installed). Needs a Standard or higher license.
                    properties:
                      enabled:
                        type: string
                        description: Enable Knative function runtime ("yes" or "no").
                        default: "no"
                        enum: ["yes", "no"]
                  k8gb:
                    type: object
                    description: >-
                      Enable k8gb (Kubernetes Global Balancer) for health-aware, DNS-based global
                      failover. Installs the AWS Load Balancer Controller, the k8gb operator, and
                      CoreDNS exposed via an NLB, and provisions an Envoy Gateway data plane. See docs/gslb-dns-architecture.md.
                    x-kubernetes-validations:
                    - rule: 'self.enabled != "yes" || (has(self.dnsZone) && self.dnsZone != "" && has(self.parentZone) && self.parentZone != "")'
                      message: 'dnsZone and parentZone are required when k8gb.enabled is "yes"'
                    properties:
                      enabled:
                        type: string
                        description: Enable k8gb ("yes" or "no").
                        default: "no"
                        enum: ["yes", "no"]
                      dnsZone:
                        type: string
                        description: Load-balanced DNS zone k8gb controls (e.g. gslb.example.com).
                      parentZone:
                        type: string
                        description: Parent zone that delegates to the load-balanced zone (e.g. example.com).
                      clusterGeoTag:
                        type: string
                        description: >-
                          Unique geo tag for this cluster's k8gb instance. Must be unique per control
                          plane. Defaults to aws-<region>-<id> when omitted.
                      strategy:
                        type: string
                        description: k8gb failover strategy for Gslb resources on this cluster.
                        enum:
                        - failover
                        - roundRobin
                        - geoip
                        default: failover
                  argocd:
                    type: object
                    description: >-
                      Enable ArgoCD (GitOps app-of-apps) with a UI exposed via Envoy Gateway (Gateway API).
                    properties:
                      enabled:
                        type: string
                        description: Enable ArgoCD ("yes" or "no").
                        default: "no"
                        enum: ["yes", "no"]
                      hostname:
                        type: string
                        description: Hostname for the ArgoCD UI (e.g. argocd.example.com).
                      url:
                        type: string
                        description: Public git repository URL for the root app-of-apps Application.
                  managementMode:
                    description: >-
                      How Crossplane reconciles this control plane's resources.
                      Full (default) manages the entire lifecycle including
                      deletion (standard Crossplane behavior). Provision creates
                      and imports resources and keeps them updated but never
                      deletes them, so the control plane persists (orphans) when
                      this XR is removed and is re-imported on the next apply -
                      used by the dynamic-provisioning pipeline. ObserveOnly
                      imports and watches without making changes (safe take-over).
                      Deprovision is the pipeline's decommission signal: it imports
                      and deletes (Create/Observe/Delete) without Update, so a
                      drifted control plane is torn down rather than reconciled.
                    type: string
                    enum:
                    - Provision
                    - ObserveOnly
                    - Full
                    - Deprovision
                    default: Full
                  naming:
                    description: >-
                      How the composed EKS resources are named, forwarded to the
                      EKS XR. Generated (the default) lets Crossplane assign
                      {xr-name}-{random}, which is what every existing deployment
                      uses. Deterministic derives names from `id`, making the EKS
                      cluster, its three IAM roles and the node group importable by
                      name with no AWS query - and the addons and access entries
                      too, since their identifiers are templated from the cluster
                      name. WARNING: changing this on a live control plane is
                      destructive. Crossplane cannot rename a composed resource,
                      so it deletes the existing EKS cluster and builds a
                      replacement. Set it at creation time, or during a
                      maintenance window.
                    type: string
                    enum:
                    - Generated
                    - Deterministic
                    default: Generated
                required:
                - id
                - region
                - nodes
            required:
            - parameters
            type: object
          status:
            description: A Status represents the observed state
            properties:
              controlplane:
                description: Status information for the control plane
                type: object
                x-kubernetes-preserve-unknown-fields: true
                properties:
                  created:
                    description: Creation timestamp of this ControlPlane resource (RFC 3339).
                    type: string
                  uxp:
                    description: UXP installation status on the EKS cluster.
                    type: object
                    properties:
                      version:
                        description: UXP Helm chart version deployed on this control plane.
                        type: string
                      ready:
                        description: True when the UXP Helm Release is Ready (all UXP pods running).
                        type: boolean
                  backup:
                    description: Backup status - populated once the EKS cluster is ready and backup is enabled.
                    type: object
                    properties:
                      enabled:
                        description: Whether backup is enabled for this control plane.
                        type: string
                      bucketArn:
                        description: S3 bucket ARN configured as the backup destination.
                        type: string
                      roleArn:
                        description: ARN of the IRSA IAM role created for the UXP backup controller.
                        type: string
                      lastBackupTime:
                        description: Timestamp of the most recent scheduled backup run, sourced from BackupSchedule status.
                        type: string
                  resources:
                    description: Managed resource health summary across all composed resources.
                    type: object
                    properties:
                      total:
                        description: Total number of composed managed resources.
                        type: integer
                      synced:
                        description: Number of composed resources with Synced=True.
                        type: integer
                      ready:
                        description: Number of composed resources with Ready=True.
                        type: integer
                      syncedAndReady:
                        description: Number of composed resources with both Synced=True and Ready=True.
                        type: integer
                  knative:
                    description: Knative feature status.
                    type: object
                    properties:
                      enabled:
                        description: Whether Knative function runtime is enabled.
                        type: string
                  k8gb:
                    description: >-
                      k8gb producer status - the contract the FleetGslb aggregator consumes.
                    type: object
                    properties:
                      enabled:
                        description: Whether k8gb is enabled.
                        type: string
                      coreDNSEndpoint:
                        description: >-
                          Informational: the CoreDNS NLB hostname. NS glue is built from
                          the pinned Elastic IPs in glueAddresses, not from this value.
                        type: string
                      nsName:
                        description: >-
                          The k8gb NS name for this cluster (gslb-ns-<geoTag>-<flatZone>.<parentZone>),
                          consumed by FleetGslb.
                        type: string
                      glueAddresses:
                        description: >-
                          Pinned CoreDNS Elastic IPs backing the NS glue A records. Consumed by FleetGslb.
                        type: array
                        items:
                          type: string
                      delegationRecord:
                        description: >-
                          Ready-to-use NS + glue delegation (one NS line plus one A line per
                          glueAddress) for FleetGslb to write to the parent zone.
                        type: string
                  providerVerticalPodAutoscaling:
                    description: Provider VPA feature status.
                    type: object
                    properties:
                      enabled:
                        description: Whether provider Vertical Pod Autoscaling is enabled.
                        type: string
                  nodes:
                    description: Node group status.
                    type: object
                    properties:
                      instanceType:
                        description: Desired EC2 instance type for worker nodes.
                        type: string
                      currentInstanceType:
                        description: >-
                          Currently running instance type observed from AWS. Differs from
                          instanceType when an in-place change was attempted - see the
                          NodeGroupTypeImmutable condition for remediation guidance.
                        type: string
            type: object
        required:
        - spec
        type: object
    served: true
