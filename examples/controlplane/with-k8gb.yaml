# ControlPlane with the k8gb add-on enabled. Installs the AWS Load Balancer
# Controller (EKS Pod Identity), the k8gb operator, and CoreDNS exposed via an
# NLB serving UDP+TCP:53, and pulls in nginx-ingress + cert-manager. The XR
# surfaces status.controlplane.k8gb.coreDNSEndpoint + delegationRecord for the
# fleet aggregator (FleetGslb) to consume. See docs/gslb-dns-architecture.md.
apiVersion: aws.platform.upbound.io/v1alpha1
kind: ControlPlane
metadata:
  name: k8gb-control-plane
spec:
  parameters:
    id: k8gb-control-plane
    region: us-west-2
    version: "1.34"
    nodes:
      count: 3
      instanceType: t3.medium
    k8gb:
      enabled: "yes"
      dnsZone: gslb.example.com
      parentZone: example.com
      strategy: failover
      # clusterGeoTag defaults to aws-<region>-<id> when omitted.
