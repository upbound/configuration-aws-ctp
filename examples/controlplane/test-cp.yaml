apiVersion: aws.platform.upbound.io/v1alpha1
kind: ControlPlane
metadata:
  name: jramut-test-cp
spec:
  parameters:
    id: jramut-test-cp
    region: us-east-1
    version: "1.34"
    nodes:
      count: 3
      instanceType: t3.medium
    accessConfig:
      authenticationMode: API_AND_CONFIG_MAP
      bootstrapClusterCreatorAdminPermissions: true
    backup:
      enabled: "yes"
      location: arn:aws:s3:::jramut-uxp-ctp-backup-dr   # <-- change if this name is taken
      schedule: "0 */2 * * *"
    knative:
      enabled: "yes"
    providerVerticalPodAutoscaling:
      enabled: "yes"
      minCpu: "100m"
      maxCpu: "2"
      minMemory: "100Mi"
      maxMemory: "4000Mi"
    k8gb:
      enabled: "yes"
      dnsZone: gslb.example.com
      parentZone: example.com
      strategy: failover
    argocd:
      enabled: "yes"
      hostname: argocd.example.com
      url: https://github.com/example/my-gitops-repo
    license:
      secretRef:
        name: uxp-license
        namespace: crossplane-system
    
    