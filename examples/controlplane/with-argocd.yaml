# ControlPlane with the ArgoCD add-on enabled. Installs ArgoCD with a UI exposed
# via Envoy Gateway (Gateway + HTTPRoute) + a self-signed cert-manager
# Certificate, and a root app-of-apps Application pointing at a public git repo.
# Provisions Envoy Gateway + cert-manager.
apiVersion: aws.platform.upbound.io/v1alpha1
kind: ControlPlane
metadata:
  name: argocd-control-plane
  namespace: platform
spec:
  parameters:
    id: argocd-control-plane
    region: us-west-2
    version: "1.34"
    nodes:
      count: 3
      instanceType: t3.medium
    argocd:
      enabled: "yes"
      hostname: argocd.example.com
      url: https://github.com/example/my-gitops-repo
